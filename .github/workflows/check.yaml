name: check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  passed:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The resolved npm tree is the scan input; installing it also gives ol the package license files.
      - run: npm ci --ignore-scripts
      # seiton: disable-next-line unpinned-uses
      - uses: ./check
        id: check
        with:
          allow-licenses: "MIT,ISC,Apache-2.0,BSD-2-Clause,BSD-3-Clause,0BSD"
          seed-cache: missing.olcache
      - name: Test action output
        shell: bash
        env:
          RESULT: ${{ steps.check.outputs.result }}
          REPORT_PATH: ${{ steps.check.outputs.report-path }}
          SARIF_PATH: ${{ steps.check.outputs.sarif-path }}
        run: |
          [[ "$RESULT" == "passed" ]]
          [[ -s "$REPORT_PATH" ]]
          [[ -s "$SARIF_PATH" ]]

  violations:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      # seiton: disable-next-line unpinned-uses
      - uses: ./check
        id: check
        continue-on-error: true
        with:
          allow-licenses: "MIT"
      - name: Test action fails on violations
        env:
          OUTCOME: ${{ steps.check.outcome }}
          RESULT: ${{ steps.check.outputs.result }}
        run: |
          [[ "$OUTCOME" == "failure" ]]
          [[ "$RESULT" == "violations" ]]

  check-complete:
    if: ${{ !cancelled() }}
    needs: [passed, violations]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail on failed checks
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "Check complete"
