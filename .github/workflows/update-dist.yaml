name: update dist

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

jobs:
  update-dist:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check regenerated dist diff
        id: dist-diff
        shell: bash
        run: |
          if git diff --quiet -- dist/ && [ -z "$(git ls-files --others --exclude-standard -- dist/)" ]; then
            echo "No dist changes."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "dist changes detected."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: ${{ steps.dist-diff.outputs.has_changes == 'true' }}
        id: app-token
        with:
          client-id: ${{ secrets.SYNCED_ACTIONS_BOT_CLIENTID }}
          private-key: ${{ secrets.SYNCED_ACTIONS_BOT_PRIVATE_KEY }}
          permission-contents: write
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Setup git auth
        if: ${{ steps.dist-diff.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://github-actions:${GH_TOKEN}@github.com/${{ github.repository }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Commit regenerated dist
        if: ${{ steps.dist-diff.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          git add -A dist/
          git commit -m "chore: regenerate dist for dependency update"
          git push
