version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
