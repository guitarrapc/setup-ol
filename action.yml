name: "Setup Ol"
description: "Sets up ol CLI in your GitHub Actions workflow."
author: "guitarrapc"
inputs:
  ol-version:
    description: "The version of ol to install. Use latest to install the latest release."
    required: false
    default: "latest"
  github-token:
    description: "Optional GitHub token to avoid API rate limits when resolving releases."
    required: false
    default: ${{ github.token }}
outputs:
  ol-version:
    description: "Installed ol version."
  ol-path:
    description: "Directory path added to PATH that contains the ol binary."
runs:
  using: "node24"
  main: "dist/index.js"
branding:
  icon: "terminal"
  color: "green"
